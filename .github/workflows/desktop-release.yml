name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test scripts/observability.test.mjs scripts/providers.test.mjs scripts/model-json.test.mjs scripts/agent-guard.test.mjs
      - name: Package desktop with Chromium
        run: npm run package -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AGENT37_API_KEY: ${{ secrets.AGENT37_API_KEY }}
          AGENT37_INSTANCE_ID: ${{ secrets.AGENT37_INSTANCE_ID }}
          INSTA_ADAPTER_HOST_URL: ${{ secrets.INSTA_ADAPTER_HOST_URL }}
          INSTA_PUBLISH_TOKEN: ${{ secrets.INSTA_PUBLISH_TOKEN }}
      - name: Verify packaged Linux app
        if: matrix.platform == 'linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a node scripts/smoke-packaged.mjs
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: nexus-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.exe
            release/*.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publish testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd installers
          sha256sum *.deb *.exe *.zip > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
